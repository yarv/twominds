[project]
name = "twominds"
version = "0.2.0"
description = "TwoMinds: within-model coherence evals for LLMs — repeated free-form sampling scored by a cross-sample LLM judge."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Anonymous" },
]
keywords = ["llm", "evals", "coherence", "consistency", "ai-safety", "inspect-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.45.2",
    "inspect-ai>=0.3.233",
    "matplotlib>=3.10.7",
    "numpy>=1.26.0,<2.0.0",
    "openai>=1.63.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tiktoken>=0.7.0",
    "typer>=0.9.0",
]

[project.scripts]
twominds = "twominds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["twominds"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
