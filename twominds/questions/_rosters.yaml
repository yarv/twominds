# Named rosters: explicit, ordered question-id lists selectable via
# `--roster <name>`. A roster pins an exact question set by id, independent of
# tier/audience/bucket reorg — useful for run-to-run comparability. Add one as a
# key under `rosters:` whose value is an ordered list of question ids.
# (Files starting with "_" are not question files; the loader skips them.)
#
# Shipped rosters freeze the question sets behind the paper
# "An Investigation of Model Coherence: Narrow Finetunes Contradict Themselves
# Under Resampling" (2026):
#
#   paper-stance     the 175 stance questions of the main results (the whole
#                    tier_1 bucket as of 2026-08-24, group-major order).
#                    uv run twominds run --roster paper-stance --n 20
#   paper-families   the 20 framing families (60 questions) of the
#                    prompt-variance appendix; the pooled family analysis runs
#                    automatically because every id carries a `family:`.
#                    uv run twominds run --roster paper-families --n 20 --max-tokens 8192
#
# See README.md, "Reproducing the paper", for the run-to-figure map.

